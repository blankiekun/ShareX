name: Build ShareX (PR)

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**.md"

permissions:
  contents: read

# A new push to the same PR cancels the build still running for the old one.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - Debug
        platform:
          - x64

    env:
      SOLUTION_FILE_PATH: ShareX.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration "${{ matrix.configuration }}" -p:Platform="${{ matrix.platform }}" "${{ env.SOLUTION_FILE_PATH }}"

      # The video thumbnail tests run the real ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test recording
        run: dotnet test --no-build --configuration "${{ matrix.configuration }}" -p:Platform="${{ matrix.platform }}" ShareX.ScreenRecordingLib.Tests/ShareX.ScreenRecordingLib.Tests.csproj
